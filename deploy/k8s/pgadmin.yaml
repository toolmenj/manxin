# pgAdmin：管理員看資料庫原始資料用。刻意不建 Ingress，不對外開放。
# 使用：kubectl -n manxin port-forward svc/manxin-pgadmin 5050:80
#      然後在自己電腦打開 http://localhost:5050，用 secret.yaml 的 PGADMIN_DEFAULT_EMAIL／PASSWORD 登入，
#      新增伺服器：主機 manxin-postgres、帳號 manxin、密碼 POSTGRES_PASSWORD。
# 注意：這裡看得到信件內容。依產品原則，只在處理問題時使用。
apiVersion: v1
kind: Service
metadata:
  name: manxin-pgadmin
  labels: { app.kubernetes.io/name: manxin-pgadmin }
spec:
  type: ClusterIP
  selector: { app.kubernetes.io/name: manxin-pgadmin }
  ports:
    - name: http
      port: 80
      targetPort: 80
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: manxin-pgadmin
  labels: { app.kubernetes.io/name: manxin-pgadmin }
spec:
  replicas: 1
  selector:
    matchLabels: { app.kubernetes.io/name: manxin-pgadmin }
  template:
    metadata:
      labels: { app.kubernetes.io/name: manxin-pgadmin }
    spec:
      containers:
        - name: pgadmin
          image: dpage/pgadmin4:9
          env:
            - name: PGADMIN_DEFAULT_EMAIL
              valueFrom: { secretKeyRef: { name: manxin-secret, key: PGADMIN_DEFAULT_EMAIL } }
            - name: PGADMIN_DEFAULT_PASSWORD
              valueFrom: { secretKeyRef: { name: manxin-secret, key: PGADMIN_DEFAULT_PASSWORD } }
            - { name: PGADMIN_DISABLE_POSTFIX, value: "true" }
          ports:
            - containerPort: 80
          resources:
            requests: { cpu: 50m, memory: 256Mi }
            limits: { memory: 512Mi }
