# API（同時提供前端網頁）。可以開多份；每份啟動前先跑資料庫遷移（有鎖，不會互撞）。
apiVersion: v1
kind: Service
metadata:
  name: manxin-api
  labels: { app.kubernetes.io/name: manxin-api }
spec:
  selector: { app.kubernetes.io/name: manxin-api }
  ports:
    - name: http
      port: 80
      targetPort: 8080
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: manxin-api
  labels: { app.kubernetes.io/name: manxin-api }
spec:
  replicas: 2
  revisionHistoryLimit: 5
  strategy:
    rollingUpdate: { maxUnavailable: 0, maxSurge: 1 }
  selector:
    matchLabels: { app.kubernetes.io/name: manxin-api }
  template:
    metadata:
      labels: { app.kubernetes.io/name: manxin-api }
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
      # 進行中的請求與排程要跑完再關
      terminationGracePeriodSeconds: 40
      initContainers:
        - name: migrate
          image: manxin
          command: ["node", "dist/migrate.mjs"]
          envFrom:
            - configMapRef: { name: manxin-config }
            - secretRef: { name: manxin-secret }
          resources:
            requests: { cpu: 50m, memory: 128Mi }
            limits: { memory: 256Mi }
      containers:
        - name: api
          image: manxin
          ports:
            - containerPort: 8080
          envFrom:
            - configMapRef: { name: manxin-config }
            - secretRef: { name: manxin-secret }
          env:
            # D-033：排程由獨立的 worker 跑
            - { name: WORKER_INLINE, value: "false" }
          startupProbe:
            httpGet: { path: /healthz, port: 8080 }
            periodSeconds: 2
            failureThreshold: 30
          livenessProbe:
            httpGet: { path: /healthz, port: 8080 }
            periodSeconds: 15
          readinessProbe:
            httpGet: { path: /readyz, port: 8080 }
            periodSeconds: 5
          resources:
            requests: { cpu: 100m, memory: 192Mi }
            limits: { memory: 512Mi }
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: ["ALL"] }
          volumeMounts:
            - { name: tmp, mountPath: /tmp }
      volumes:
        - name: tmp
          emptyDir: {}
