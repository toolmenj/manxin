# PostgreSQL 16（叢集裡跑）。資料放在持久儲存區，Pod 重開不會消失。
# 上傳的檔案也存在這裡（STORAGE=db），所以容量要留夠。
apiVersion: v1
kind: Service
metadata:
  name: manxin-postgres
  labels: { app.kubernetes.io/name: manxin-postgres }
spec:
  selector: { app.kubernetes.io/name: manxin-postgres }
  ports:
    - name: postgres
      port: 5432
      targetPort: 5432
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: manxin-postgres
  labels: { app.kubernetes.io/name: manxin-postgres }
spec:
  serviceName: manxin-postgres
  replicas: 1
  selector:
    matchLabels: { app.kubernetes.io/name: manxin-postgres }
  template:
    metadata:
      labels: { app.kubernetes.io/name: manxin-postgres }
    spec:
      securityContext:
        fsGroup: 999
      containers:
        - name: postgres
          image: postgres:16-alpine
          env:
            - { name: POSTGRES_USER, value: manxin }
            - { name: POSTGRES_DB, value: manxin }
            - name: POSTGRES_PASSWORD
              valueFrom: { secretKeyRef: { name: manxin-secret, key: POSTGRES_PASSWORD } }
            # 掛載點底下要用子資料夾，不然 lost+found 會讓 initdb 失敗
            - { name: PGDATA, value: /var/lib/postgresql/data/pgdata }
            - { name: TZ, value: UTC }
          ports:
            - containerPort: 5432
          readinessProbe:
            exec: { command: ["pg_isready", "-U", "manxin", "-d", "manxin"] }
            periodSeconds: 5
          livenessProbe:
            exec: { command: ["pg_isready", "-U", "manxin", "-d", "manxin"] }
            initialDelaySeconds: 30
            periodSeconds: 15
          resources:
            requests: { cpu: 100m, memory: 256Mi }
            limits: { memory: 1Gi }
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        # storageClassName: local-path   ← 叢集有指定的儲存類別就填這裡
        resources:
          requests:
            storage: 20Gi
