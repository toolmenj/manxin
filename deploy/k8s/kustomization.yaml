# 慢信 Kubernetes 部署（KubeSphere 也可以直接匯入這些 YAML）
# 部署：
#   1. 複製 secret.example.yaml 成 secret.yaml，填入自己的值（secret.yaml 不要進 git）
#   2. 改 configmap.yaml 的網址與管理員信箱、ingress.yaml 的網域
#   3. 把下面 images 的 newName／newTag 改成你推上去的映像檔
#   4. kubectl apply -f secret.yaml && kubectl apply -k deploy/k8s
# 細節見 deploy/README.md
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: manxin
resources:
  - namespace.yaml
  - configmap.yaml
  - postgres.yaml
  - postgres-backup.yaml
  - api.yaml
  - worker.yaml
  - ingress.yaml
  - pgadmin.yaml
images:
  - name: manxin
    newName: REGISTRY/manxin # ← 改成你的映像檔位置，例如 harbor.example.tw/manxin/manxin
    newTag: "0.2.0"
labels:
  - pairs:
      app.kubernetes.io/part-of: manxin
