# 範本。複製成 secret.yaml 再填值；secret.yaml 已在 .gitignore，不要進 git。
# 產生隨機字串：openssl rand -hex 32
apiVersion: v1
kind: Secret
metadata:
  name: manxin-secret
  namespace: manxin
type: Opaque
stringData:
  # 至少 32 字元的隨機字串。開信連結由它算出來，上線後不要再換（換了舊連結全部失效）
  APP_SECRET: ""
  # 資料庫密碼（postgres.yaml 用它建立帳號）
  POSTGRES_PASSWORD: ""
  # API 與 worker 連資料庫用。密碼要和上面一樣
  DATABASE_URL: "postgres://manxin:<POSTGRES_PASSWORD>@manxin-postgres:5432/manxin"
  # Gmail 帳號與「應用程式密碼」（Google 帳戶 → 安全性 → 兩步驟驗證 → 應用程式密碼），不是登入密碼
  SMTP_USER: ""
  SMTP_PASS: ""
  # 中央氣象署開放資料授權碼（https://opendata.cwa.gov.tw 註冊會員取得）；空白就用模擬天氣
  CWA_API_KEY: ""
  # pgAdmin 登入用（只能從叢集內部連）
  PGADMIN_DEFAULT_EMAIL: ""
  PGADMIN_DEFAULT_PASSWORD: ""
