# 每次 push、開 PR 都跑：型別檢查、單元測試（PGlite）、真的 PostgreSQL 16 測試（含併發）、正式版映像檔能不能建起來。
name: ci
on:
  push:
    branches: [main, launch]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: manxin
          POSTGRES_PASSWORD: manxin
          POSTGRES_DB: manxin
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U manxin -d manxin"
          --health-interval 3s --health-timeout 3s --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - name: 單元測試（PGlite）
        run: npm test
      - name: API 測試（真的 PostgreSQL 16，含併發）
        run: npm run test:api
        env:
          TEST_DATABASE_URL: postgres://manxin:manxin@localhost:5432/manxin

  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: 建置正式版映像檔（不推送）
        run: docker build -t manxin:ci .
      - name: 映像檔裡有三個程式與前端網頁
        run: docker run --rm manxin:ci sh -c 'ls dist/server.mjs dist/worker.mjs dist/migrate.mjs web/index.html drizzle/meta/_journal.json'
      - name: 三個程式都載入得起來（打包漏了套件會在這裡出錯）
        run: |
          for f in server worker migrate; do
            out=$(docker run --rm -e NODE_ENV=production manxin:ci node dist/$f.mjs 2>&1 || true)
            echo "$out" | head -3
            if echo "$out" | grep -q ERR_MODULE_NOT_FOUND; then echo "$f 少了套件"; exit 1; fi
          done
      - name: 缺設定時拒絕啟動
        run: |
          if docker run --rm manxin:ci; then echo "沒設定也啟動了，不對"; exit 1; fi
